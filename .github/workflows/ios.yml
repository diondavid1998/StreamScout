name: iOS

# There is no macOS toolchain in the environment this project is usually
# edited from, so nothing under WhatsOn/ ever got compiled. This runs the
# real build and the XCTest suite on an Apple runner. Simulator destinations
# need no signing identity, so this requires no secrets.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Printed before anything else so a failure caused by a missing SDK is
      # obvious in the log rather than something to guess at. The app targets
      # iOS 26, which needs a matching Xcode.
      - name: Toolchain and SDKs available
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          xcodebuild -showsdks || true
          xcrun simctl list runtimes || true

      # Ask xcodebuild what this scheme can actually run on rather than
      # hardcoding a device name that may not exist on the runner image. If the
      # iOS 26 deployment target has no matching simulator, this comes back
      # empty and says so.
      - name: Pick a simulator
        id: sim
        run: |
          set -o pipefail
          xcodebuild -project WhatsOn.xcodeproj -scheme WhatsOn -showdestinations 2>&1 | tee destinations.txt
          UDID=$(grep 'platform:iOS Simulator' destinations.txt | grep -v 'placeholder' | head -1 | sed -E 's/.*id:([0-9A-Fa-f-]+).*/\1/')
          if [ -z "$UDID" ]; then
            echo "::error::No iOS Simulator destination is available for this scheme on this runner."
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project WhatsOn.xcodeproj \
            -scheme WhatsOn \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-results
          path: |
            TestResults.xcresult
            xcodebuild.log
            destinations.txt
          retention-days: 7
